    <polygon points="125,35 125,105 190,70" fill="#ffffff" />
    <rect x="35" y="170" width="230" height="20" rx="10" fill="#2b416d" />
    <rect x="35" y="170" width="170" height="20" rx="10" fill="#ff7a59" />
    <text x="35" y="220" fill="#aac1ea" font-family="Segoe UI, Arial, sans-serif" font-size="22">
