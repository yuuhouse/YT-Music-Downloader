  <rect x="130" y="290" width="580" height="64" rx="12" fill="#0d1427" stroke="#324c7a" />
  <text x="158" y="333" fill="#c4d3ee" font-family="Consolas, monospace" font-size="24">
    python yt_music_dl.py
  </text>

  <rect x="130" y="390" width="280" height="68" rx="14" fill="url(#accent)" />
  <text x="186" y="434" fill="#1a1020" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">
