  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="80" y="90" width="1040" height="450" rx="24" fill="#10182d" stroke="#2a3d66" stroke-width="2" />

  <text x="130" y="185" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">
